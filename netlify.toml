[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"

# Terminumfragen: Erinnerung vor Fristende und Info an den Ersteller - stuendlich (kein neuer Publish)
[functions."umfrage-erinnerung"]
  schedule = "@hourly"

# Schneller Start (2.28): Programmdateien haben eindeutige Namen (ändern sich bei jedem Update) -> darf das Handy dauerhaft behalten
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
