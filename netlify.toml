[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"

# Terminumfragen: Erinnerung vor Fristende und Info an den Ersteller - stuendlich (kein neuer Publish)
[functions."umfrage-erinnerung"]
  schedule = "@hourly"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
